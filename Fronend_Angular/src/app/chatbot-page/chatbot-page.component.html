<button class="chat-launcher" type="button" *ngIf="!isChatVisible" (click)="openChatbot()" aria-label="Open chatbot">
  <span class="launcher-orbit" aria-hidden="true"></span>

  <span class="chat-launcher-icon" aria-hidden="true">
    <span></span>
  </span>

  <span class="chat-launcher-copy">
    <strong>Chat</strong>
    <small>Online</small>
  </span>
</button>

<main class="chatbot-page" [class.is-open]="isChatVisible" [attr.aria-hidden]="!isChatVisible">
  <section class="chat-window" aria-label="Insurance chatbot">

    <header class="chat-header">

      <div class="agent-avatar" aria-hidden="true">
        <!-- <span></span> -->
        <img src="/image.png" alt="" width="49px" style="border-radius: 15px;" />
      </div>

      <div class="chat-title">
        <p>Insurance X Agent</p>

        <span>
          <i></i>
          Available to help
        </span>

        <div class="audience-toggle" role="group" aria-label="Customer type">
          <button type="button" [class.active]="selectedAudience === 'particulier'"
            (click)="setAudience('particulier')">
            👤 Individual <span class="ar"></span>
          </button>

          <button type="button" [class.active]="selectedAudience === 'professionnel'"
            (click)="setAudience('professionnel')">
            🏢 Business <span class="ar"></span>
          </button>
        </div>
      </div>

      <button class="chat-close-btn" type="button" (click)="closeChatbot()" aria-label="Close chatbot"></button>

    </header>

    <div class="messages">

      <article *ngFor="let message of messages" class="message" [class.message-client]="message.author === 'client'">
        <p>{{ message.text }}</p>
        <span>{{ message.time }}</span>
      </article>

      <article *ngIf="isTyping" class="message typing" aria-label="Assistant is typing">
        <i></i>
        <i></i>
        <i></i>
      </article>

    </div>

    <div class="quick-prompts" aria-label="Suggested questions">
      <button type="button" *ngFor="let prompt of prompts" (click)="usePrompt(prompt)">
        {{ prompt }}
      </button>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()">

      <input [(ngModel)]="newMessage" name="message" placeholder="Ask about your insurance..." />

      <button class="send-btn" type="submit" [disabled]="!newMessage.trim() || isTyping" aria-label="Send message">
        <span>Send</span>
      </button>

    </form>

  </section>
</main>

<div class="popup-backdrop" *ngIf="showPopup && isChatVisible">
  <div class="popup">

    <div class="popup-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75m-3-7.04A11.96 11.96 0 0 1 3.6 6 12 12 0 0 0 3 9.75c0 5.59 3.82 10.29 9 11.62 5.18-1.33 9-6.03 9-11.62 0-1.31-.21-2.57-.6-3.75h-.15c-3.2 0-6.1-1.25-8.25-3.29Z" />
      </svg>
    </div>

    <h3>Start your assistant</h3>

    <p class="helper-text">
      Add your information to start the conversation.
    </p>

    <span class="lang-selector-label">Language</span>

    <div class="lang-toggle" role="group" aria-label="Language selector">
      <!-- ENGLISH — DEFAULT -->
      <button type="button" class="lang-toggle-btn" [class.active]="selectedLang === 'en'" (click)="setLanguage('en')">
        English
      </button>

      <!-- FRENCH -->
      <button type="button" class="lang-toggle-btn" [class.active]="selectedLang === 'fr'" (click)="setLanguage('fr')">
        French
      </button>

      <!-- GERMAN -->
      <button type="button" class="lang-toggle-btn" [class.active]="selectedLang === 'de'" (click)="setLanguage('de')">
        German
      </button>

      <!-- ARABIC -->
      <button type="button" class="lang-toggle-btn" [class.active]="selectedLang === 'ar'" (click)="setLanguage('ar')">
        Arabic
      </button>
    </div>

    <form [formGroup]="contactForm" (ngSubmit)="startChat()">

      <label class="field-label">First name</label>

      <input type="text" formControlName="firstName" placeholder="Your first name" class="phone-input" />

      <label class="field-label">Last name</label>

      <input type="text" formControlName="lastName" placeholder="Your last name" class="phone-input" />

      <label class="field-label">Phone number</label>

      <input type="tel" formControlName="phone" placeholder="Your phone number" class="phone-input" />

      <button type="submit" class="start-btn" [disabled]="isStartingChat">
        {{ isStartingChat ? 'Starting...' : 'Start chat' }}
      </button>

    </form>

  </div>
</div>
